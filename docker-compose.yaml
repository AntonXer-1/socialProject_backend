version: '3.8'

services:
  dp:
    image: postgres:18.3-bookworm
    container_name: social-data-base
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    ports:
      - "5432:5432"

  app:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-app
    ports:
      - "8080:8080"
    depends_on:
      - dp

  migrate:
    image: migrate/migrate
    container_name: migrate-container
    volumes:
      - "./migrations:/app/migrations"