services:
  db:
    image: postgres:18.3-bookworm
    container_name: social-data-base
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER:
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"

  app:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-app
    ports:
      - "8080:8080"
    depends_on:
      - db

  migrate:
    image: migrate/migrate
    container_name: migrate-container
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations